name: T7A diagnostic

on:
  push:
    branches:
      - t7a-compatible-partial-writes
  workflow_dispatch:

jobs:
  t7a-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Print frozen T7A four-learner result
        run: python -m experiments.t7_compatible_partial_writes
