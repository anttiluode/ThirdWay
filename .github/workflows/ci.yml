name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest
      - run: python -m experiments.gate_t0_fusion
      - run: python -m experiments.gate_t1_moving_road
      - run: python -m experiments.gate_t2_credit_on_moving_road
      - run: python -m experiments.gate_t3_identifiability_credit
      - run: python -m experiments.gate_t4_causal_collision
      - run: python -m experiments.gate_t5_nonlinear_collision_radar
      - name: Verify T6 remains the recorded scientific negative
        run: |
          python - <<'PY'
          from experiments.gate_t6_persistent_skill_compatibility import _passes_gate, run
          summary = run()
          assert not _passes_gate(summary)
          assert summary.predictors["causal"].damage_correlation > 0.70
          assert summary.predictors["causal"].test_auroc > 0.84
          assert summary.predictors["causal_shuffled"].test_auroc >= summary.predictors["causal"].test_auroc
          print("T6 recorded negative reproduced")
          PY
      - run: python demo_t6_continual_learning.py
      - name: Verify T7A remains the recorded scalar safe-step negative
        run: |
          python - <<'PY'
          from experiments.t7_compatible_partial_writes import t7a_demo
          summary = t7a_demo()
          assert summary.safe_step_nonzero_writes == 12
          assert summary.reject_only_accepted == 1
          assert summary.safe_step_old_skill_accuracy < summary.reject_only_old_skill_accuracy - 0.02
          assert summary.safe_step_switch_penalty > summary.reject_only_switch_penalty + 0.005
          assert summary.safe_step_mean_accuracy < summary.base_mean_accuracy + 0.005
          assert summary.safe_step_mean_accuracy > summary.accept_all_mean_accuracy
          assert summary.oracle_used_for_safe_step is False
          print("T7A recorded negative reproduced")
          PY
      - run: python -m experiments.t7_compatible_partial_writes
      - name: Verify T7B remains the recorded signed residual-memory negative
        run: |
          python - <<'PY'
          import numpy as np
          from experiments.t7b_residual_carrying_memory import _passes_t7b, t7b_demo
          summary = t7b_demo(seed=0)
          assert not _passes_t7b(summary)
          assert summary.all_direction_pure
          assert summary.all_budget_respected
          assert summary.scalar_debt_nonzero_writes == 9
          assert summary.residual_nonzero_writes == 11
          assert summary.residual_mean_accuracy >= summary.scalar_debt_mean_accuracy + 0.005
          assert summary.residual_old_skill_accuracy >= summary.scalar_debt_old_skill_accuracy - 0.01
          assert summary.residual_old_skill_accuracy >= summary.reject_only_old_skill_accuracy - 0.02
          assert summary.residual_switch_penalty > summary.reject_only_switch_penalty + 0.005
          assert np.isclose(summary.residual_mean_accuracy, summary.base_mean_accuracy)
          assert summary.repair_events == 0
          print("T7B recorded negative reproduced")
          PY
      - run: python -m experiments.t7b_residual_carrying_memory
